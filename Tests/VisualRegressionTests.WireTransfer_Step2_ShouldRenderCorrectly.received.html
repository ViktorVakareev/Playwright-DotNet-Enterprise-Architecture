<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wire Transfer - WorldBank Mock</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar">
        <h2>WorldBank Enterprise</h2>
        <div class="nav-actions">
            <button onclick="window.location.href='dashboard.html'">Back to Dashboard</button>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h3>Initiate Wire Transfer</h3>
            
            <!-- Stepper UI -->
            <div class="stepper">
                <div class="step" id="step1-indicator">
                    <div class="circle">1</div>
                    <span>Recipient</span>
                </div>
                <div class="step active" id="step2-indicator">
                    <div class="circle">2</div>
                    <span>Amount</span>
                </div>
                <div class="step" id="step3-indicator">
                    <div class="circle">3</div>
                    <span>Review</span>
                </div>
            </div>

            <!-- Wizard Forms -->
            <div id="step1-form" style="display: none;">
                <p>Select a recipient from your approved list:</p>
                <select style="width: 100%; padding: 10px; margin-bottom: 20px;">
                    <option>Acme Corp (US)</option>
                    <option>Global Supplies Ltd (UK)</option>
                </select>
                <button onclick="nextStep(2)">Next Step</button>
            </div>

            <div id="step2-form" style="display: block;">
                <p>Enter transfer amount (USD):</p>
                <input type="number" placeholder="$ 0.00" style="width: 100%; padding: 10px; margin-bottom: 20px; caret-color: transparent !important;">
                <button onclick="nextStep(1)">Back</button>
                <button onclick="nextStep(3)">Review Transfer</button>
            </div>

            <div id="step3-form" style="display: none;">
                <div class="card" style="background: #f8f9fa; border: 1px dashed #ccc; margin-bottom: 20px;">
                    <p><strong>To:</strong> Acme Corp (US)</p>
                    <p><strong>Amount:</strong> $50,000.00</p>
                    <p><strong>Fee:</strong> $15.00</p>
                </div>
                <button onclick="nextStep(2)">Back</button>
                <button style="background: var(--success); color: white;">Confirm &amp; Send</button>
            </div>

        </div>
    </div>

    <script>
        // Simple Stepper Logic for Visual Testing
        function nextStep(stepNumber) {
            // Reset all
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            document.getElementById('step1-form').style.display = 'none';
            document.getElementById('step2-form').style.display = 'none';
            document.getElementById('step3-form').style.display = 'none';

            // Activate current
            document.getElementById(`step${stepNumber}-indicator`).classList.add('active');
            document.getElementById(`step${stepNumber}-form`).style.display = 'block';
        }
    </script>

</body></html>
